<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>cURL to yt-dlp Converter</title>
        <link rel="icon" type="image/x-icon" href="images/icon.png" />
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
                background-color: #f7f9fb;
            }
            .code-box {
                background-color: #1f2937; /* Dark background for code */
                color: #f3f4f6;
                padding: 1rem;
                border-radius: 0.5rem;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-all;
                min-height: 4rem;
                max-height: 20rem;
            }
            .code-input {
                background-color: #e5e7eb;
                color: #1f2937;
                border: 1px solid #d1d5db;
            }
        </style>
    </head>
    <body class="p-4 sm:p-8">
        <div class="max-w-4xl mx-auto">
            <header class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
                    cURL to yt-dlp Converter
                </h1>
                <p class="text-gray-500">
                    Paste your network tab cURL command below to generate a
                    runnable yt-dlp command with necessary headers included by
                    default.
                </p>
            </header>

            <!-- Input Section -->
            <div class="bg-white p-6 rounded-xl shadow-2xl mb-8">
                <label
                    for="curl-input"
                    class="block text-lg font-semibold text-gray-700 mb-3 flex items-center"
                >
                    Paste cURL Command Here
                </label>
                <textarea
                    id="curl-input"
                    rows="10"
                    placeholder="Paste your full 'curl ...' command"
                    class="code-input w-full p-4 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out resize-none text-sm"
                ></textarea>

                <!-- OPTIONS -->
                <div class="mt-4 space-y-2">
                    <div class="flex items-center">
                        <input
                            id="include-cookies"
                            type="checkbox"
                            class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                        />
                        <label
                            for="include-cookies"
                            class="ml-2 block text-sm font-medium text-gray-700"
                        >
                            Include Cookies (--add-header 'cookie:...')
                        </label>
                    </div>
                </div>
                <!-- END OPTIONS -->

                <!-- CUSTOM FILENAME INPUT -->
                <div class="mt-4">
                    <label
                        for="custom-filename-input"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Custom Output Filename (Optional)
                    </label>
                    <input
                        id="custom-filename-input"
                        type="text"
                        placeholder="e.g., MyVideo (Extension %(ext)s is added automatically)"
                        class="code-input w-full p-2 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-sm"
                    />
                </div>
                <!-- END CUSTOM FILENAME INPUT -->

                <button
                    id="convert-button"
                    onclick="convertCurlToYtDlp()"
                    class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200 ease-in-out transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50"
                >
                    Convert to yt-dlp Command
                </button>
            </div>

            <!-- yt-dlp Command Output Section -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-lg font-semibold text-gray-100">
                        Generated yt-dlp Command
                    </label>
                    <button
                        id="copy-button"
                        onclick="copyToClipboard('ytdlp-output')"
                        disabled
                        class="text-sm bg-gray-600 hover:bg-gray-700 text-white py-1.5 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Copy Command
                    </button>
                </div>
                <div
                    id="ytdlp-output"
                    class="code-box font-mono text-sm select-all"
                >
                    The generated command will appear here after conversion.
                </div>
            </div>

            <!-- Message Box for Feedback -->
            <div
                id="message-box"
                class="fixed bottom-4 right-4 bg-green-500 text-white p-3 rounded-lg shadow-lg hidden transition-opacity duration-300"
            >
                Copied to clipboard!
            </div>
        </div>

        <script>
            const curlInput = document.getElementById("curl-input");
            const ytdlpOutput = document.getElementById("ytdlp-output");
            const copyButton = document.getElementById("copy-button");
            const messageBox = document.getElementById("message-box");
            const customFilenameInput = document.getElementById(
                "custom-filename-input",
            );

            // Checkboxes
            const includeCookies = document.getElementById("include-cookies");

            /**
             * Shows a temporary feedback message.
             * @param {string} msg The message to display.
             * @param {string} type The type of message (success or error).
             */
            function showMessage(msg, type = "success") {
                messageBox.textContent = msg;
                messageBox.className = `fixed bottom-4 right-4 p-3 rounded-lg shadow-lg transition-opacity duration-300 ${
                    type === "success" ? "bg-green-500" : "bg-red-500"
                }`;
                messageBox.style.display = "block";

                setTimeout(() => {
                    messageBox.style.display = "none";
                }, 3000);
            }

            /**
             * Converts the cURL command string to a yt-dlp command.
             */
            function convertCurlToYtDlp() {
                // Clean up the input: remove line breaks and extra spaces
                const curlCmd = curlInput.value
                    .trim()
                    .replace(/\\\s*\n/g, " ")
                    .replace(/\s+/g, " ");

                if (!curlCmd) {
                    ytdlpOutput.innerHTML = "Please paste a cURL command.";
                    copyButton.disabled = true;
                    return;
                }

                // 1. Extract URL
                let url = null;
                // Matches 'URL' after 'curl '
                const urlMatchSingle = curlCmd.match(/^curl\s+'([^']+)'/);
                // Matches "URL" after 'curl '
                const urlMatchDouble = curlCmd.match(/^curl\s+"([^"]+)"/);

                if (urlMatchSingle) {
                    url = urlMatchSingle[1];
                } else if (urlMatchDouble) {
                    url = urlMatchDouble[1];
                }

                if (!url) {
                    ytdlpOutput.innerHTML =
                        "<span class='text-red-400'>Error: Could not find a valid URL in the command.</span>";
                    copyButton.disabled = true;
                    return;
                }

                let headers = [];
                let cookieString = "";
                let userAgentHeader = "";

                // 2. Extract Headers (-H)
                const headerRegex = /-H\s+'([^']+)'/g;
                let match;

                while ((match = headerRegex.exec(curlCmd)) !== null) {
                    const header = match[1];
                    const parts = header.split(":").map((p) => p.trim());
                    const headerName = parts[0].toLowerCase();

                    if (headerName === "cookie") {
                        // 3a. Capture cookie string from -H 'cookie:...'
                        cookieString = header
                            .substring(header.indexOf(":") + 1)
                            .trim();
                    } else if (headerName === "user-agent") {
                        // 3b. Capture User-Agent separately. Will be added unconditionally later.
                        userAgentHeader = header;
                    } else {
                        // 3c. Add all other headers (including accept, accept-language, and all security headers) unconditionally.
                        headers.push(`--add-header '${header}'`);
                    }
                }

                // 3d. Extract Cookies (-b) - overrides -H 'cookie' capture
                const cookieMatch = curlCmd.match(/-b\s+'([^']+)'/);
                if (cookieMatch) {
                    cookieString = cookieMatch[1];
                }

                // 4. Construct the final yt-dlp command
                let ytdlpCommand = `yt-dlp ${headers.join(" ")}`;

                // Add User-Agent unconditionally using the --user-agent flag and double quotes
                if (userAgentHeader) {
                    // Extract only the User-Agent value (e.g., stripping 'user-agent: ')
                    const uaValue = userAgentHeader
                        .replace(/^user-agent:\s*/i, "")
                        .trim();
                    ytdlpCommand += ` --user-agent "${uaValue}"`;
                }

                // Add Cookies if checked
                if (cookieString && includeCookies.checked) {
                    ytdlpCommand += ` --add-header 'cookie: ${cookieString}'`;
                }

                // --- Custom Output Filename Logic ---
                const customFilename = customFilenameInput.value.trim();
                let outputFlag;

                if (customFilename) {
                    // If a custom filename is provided (e.g., 'MyVideo'), append the automatic extension.
                    outputFlag = ` -o '${customFilename}.%(ext)s'`;
                } else {
                    // Use yt-dlp's default intelligent naming (title + extension)
                    outputFlag = ` -o '%(title)s.%(ext)s'`;
                }

                // Final URL and output naming
                ytdlpCommand += outputFlag;
                ytdlpCommand += ` '${url}'`;
                // --- End Custom Output Filename Logic ---

                // 5. Update UI for the main command
                ytdlpOutput.textContent = ytdlpCommand.trim();
                copyButton.disabled = false;
            }

            /**
             * Copies the content of a given element ID to the clipboard.
             * @param {string} elementId The ID of the element whose text to copy.
             */
            function copyToClipboard(elementId) {
                const textToCopy =
                    document.getElementById(elementId).textContent;

                // Use the older document.execCommand('copy') for better compatibility in iframe environments
                try {
                    const tempTextArea = document.createElement("textarea");
                    tempTextArea.value = textToCopy;
                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempTextArea);
                    showMessage("Copied to clipboard!");
                } catch (err) {
                    showMessage("Failed to copy command.", "error");
                    console.error("Copy failed: ", err);
                }
            }

            // Run conversion on paste for better UX
            curlInput.addEventListener("paste", () => {
                // Use a short timeout to ensure the paste event is fully processed
                setTimeout(convertCurlToYtDlp, 10);
            });

            // Add listeners to re-convert command whenever options change
            includeCookies.addEventListener("change", convertCurlToYtDlp);
            customFilenameInput.addEventListener("input", convertCurlToYtDlp);
        </script>
    </body>
</html>
