<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>cURL to yt-dlp Converter</title>
        <link rel="icon" type="image/x-icon" href="images/icon.png" />
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
                background-color: #f7f9fb;
            }
            .code-box {
                background-color: #1f2937; /* Dark background for code */
                color: #f3f4f6;
                padding: 1rem;
                border-radius: 0.5rem;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-all;
                min-height: 4rem;
                max-height: 20rem;
            }
            .code-input {
                background-color: #e5e7eb;
                color: #1f2937;
                border: 1px solid #d1d5db;
            }
        </style>
    </head>
    <body class="p-4 sm:p-8">
        <div class="max-w-4xl mx-auto">
            <header class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
                    cURL to yt-dlp Converter
                </h1>
                <p class="text-gray-500">
                    Paste your network tab cURL command below to generate a
                    runnable yt-dlp command with necessary headers included by
                    default.
                </p>
            </header>

            <!-- Input Section -->
            <div class="bg-white p-6 rounded-xl shadow-2xl mb-8">
                <label
                    for="curl-input"
                    class="block text-lg font-semibold text-gray-700 mb-3 flex items-center"
                >
                    Paste cURL Command Here
                </label>
                <textarea
                    id="curl-input"
                    rows="10"
                    placeholder="Paste your full 'curl ...' command"
                    class="code-input w-full p-4 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out resize-none text-sm"
                ></textarea>

                <!-- OPTIONS -->
                <div class="mt-4 space-y-2">
                    <div class="flex items-center">
                        <input
                            id="include-cookies"
                            type="checkbox"
                            class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                        />
                        <label
                            for="include-cookies"
                            class="ml-2 block text-sm font-medium text-gray-700"
                        >
                            Include Cookies (--add-header 'cookie:...')
                        </label>
                    </div>
                </div>
                <!-- END OPTIONS -->

                <!-- CUSTOM FILENAME INPUT -->
                <div class="mt-4">
                    <label
                        for="custom-filename-input"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Custom Output Filename (Optional)
                    </label>
                    <input
                        id="custom-filename-input"
                        type="text"
                        placeholder="e.g., MyVideo (Extension %(ext)s is added automatically)"
                        class="code-input w-full p-2 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-sm"
                    />
                </div>
                <!-- END CUSTOM FILENAME INPUT -->

                <button
                    id="convert-button"
                    onclick="convertCurlToYtDlp()"
                    class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200 ease-in-out transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50"
                >
                    Convert to yt-dlp Command
                </button>
            </div>

            <!-- yt-dlp Command Output Section -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-2xl">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-lg font-semibold text-gray-100">
                        Generated yt-dlp Command
                    </label>
                    <button
                        id="copy-button"
                        onclick="copyToClipboard('ytdlp-output')"
                        disabled
                        class="text-sm bg-gray-600 hover:bg-gray-700 text-white py-1.5 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Copy Command
                    </button>
                </div>
                <div
                    id="ytdlp-output"
                    class="code-box font-mono text-sm select-all"
                >
                    The generated command will appear here after conversion.
                </div>
            </div>

            <!-- Message Box for Feedback -->
            <div
                id="message-box"
                class="fixed bottom-4 right-4 bg-green-500 text-white p-3 rounded-lg shadow-lg hidden transition-opacity duration-300"
            >
                Copied to clipboard!
            </div>
        </div>

        <script>
            const curlInput = document.getElementById("curl-input");
            const ytdlpOutput = document.getElementById("ytdlp-output");
            const copyButton = document.getElementById("copy-button");
            const messageBox = document.getElementById("message-box");
            const customFilenameInput = document.getElementById(
                "custom-filename-input",
            );

            // Checkboxes
            const includeCookies = document.getElementById("include-cookies");

            /**
             * Shows a temporary feedback message.
             * @param {string} msg The message to display.
             * @param {string} type The type of message (success or error).
             */
            function showMessage(msg, type = "success") {
                messageBox.textContent = msg;
                messageBox.className = `fixed bottom-4 right-4 p-3 rounded-lg shadow-lg transition-opacity duration-300 ${
                    type === "success" ? "bg-green-500" : "bg-red-500"
                }`;
                messageBox.style.display = "block";

                setTimeout(() => {
                    messageBox.style.display = "none";
                }, 3000);
            }

            /**
             * Escapes single quotes for POSIX shell command compatibility.
             * @param {string} str The string to escape.
             * @returns {string} The escaped string.
             */
            function escapeSingleQuote(str) {
                return str.replace(/'/g, "'\\''");
            }

            /**
             * Tokenizes a shell command string into discrete arguments, handling
             * single quotes, double quotes, escape sequences, and line continuations.
             * @param {string} input The raw command string.
             * @returns {string[]} Array of argument tokens.
             */
            function tokenizeCurl(input) {
                // Pre-clean: strip line continuations (\ or ^ followed by newline)
                // and normalize Windows CMD caret-escaped quotes (^")
                const clean = input
                    .trim()
                    .replace(/\\\s*\r?\n/g, " ")
                    .replace(/\^\s*\r?\n/g, " ")
                    .replace(/\^"/g, '"');

                const args = [];
                let current = "";
                let inSingle = false;
                let inDouble = false;
                let escaped = false;
                let tokenStarted = false;

                for (let i = 0; i < clean.length; i++) {
                    const c = clean[i];

                    if (escaped) {
                        current += c;
                        escaped = false;
                        tokenStarted = true;
                        continue;
                    }

                    if (c === "\\" && !inSingle) {
                        escaped = true;
                        tokenStarted = true;
                        continue;
                    }

                    if (c === "'" && !inDouble) {
                        inSingle = !inSingle;
                        tokenStarted = true;
                        continue;
                    }

                    if (c === '"' && !inSingle) {
                        inDouble = !inDouble;
                        tokenStarted = true;
                        continue;
                    }

                    if (!inSingle && !inDouble && /\s/.test(c)) {
                        if (tokenStarted) {
                            args.push(current);
                            current = "";
                            tokenStarted = false;
                        }
                        continue;
                    }

                    current += c;
                    tokenStarted = true;
                }

                if (tokenStarted) {
                    args.push(current);
                }

                return args;
            }

            /**
             * Converts the cURL command string to a yt-dlp command.
             */
            function convertCurlToYtDlp() {
                const rawInput = curlInput.value.trim();

                if (!rawInput) {
                    ytdlpOutput.textContent = "Please paste a cURL command.";
                    copyButton.disabled = true;
                    return;
                }

                const args = tokenizeCurl(rawInput);
                if (args.length === 0) {
                    ytdlpOutput.textContent = "Please paste a cURL command.";
                    copyButton.disabled = true;
                    return;
                }

                let startIndex = 0;
                if (/^curl(\.exe)?$/i.test(args[0])) {
                    startIndex = 1;
                }

                let url = null;
                const headers = [];
                let cookieString = "";
                let userAgent = "";
                const positional = [];

                const knownOptionsWithArg = new Set([
                    "-h", "--header",
                    "-b", "--cookie",
                    "-c", "--cookie-jar",
                    "-a", "--user-agent",
                    "-e", "--referer",
                    "-x", "--request",
                    "-d", "--data", "--data-raw", "--data-ascii", "--data-binary", "--data-urlencode",
                    "-f", "--form", "--form-string",
                    "-u", "--user",
                    "-o", "--output",
                    "-m", "--max-time",
                    "--url",
                    "--proxy",
                    "--retry",
                    "--connect-timeout",
                    "--cacert", "--cert", "--key"
                ]);

                function processHeader(headerVal) {
                    const colonIdx = headerVal.indexOf(":");
                    if (colonIdx === -1) {
                        headers.push(`--add-header '${escapeSingleQuote(headerVal)}'`);
                        return;
                    }
                    const name = headerVal.substring(0, colonIdx).trim().toLowerCase();
                    const value = headerVal.substring(colonIdx + 1).trim();

                    if (name === "cookie") {
                        cookieString = value;
                    } else if (name === "user-agent") {
                        userAgent = value;
                    } else if (name === "range" || name === "if-range") {
                        // Skip Range and If-Range headers: browser DevTools requests often
                        // request partial chunk ranges (e.g. bytes=32768-...) while streaming.
                        // Forwarding these to yt-dlp causes it to download only that chunk,
                        // missing the initial container metadata (ftyp/moov atoms) and producing
                        // a corrupted/unplayable video file.
                        return;
                    } else {
                        headers.push(`--add-header '${escapeSingleQuote(headerVal)}'`);
                    }
                }

                for (let i = startIndex; i < args.length; i++) {
                    const arg = args[i];

                    // --url
                    if (arg === "--url") {
                        if (i + 1 < args.length) url = args[++i];
                        continue;
                    }
                    if (arg.startsWith("--url=")) {
                        url = arg.substring(6);
                        continue;
                    }

                    // -H, --header
                    if (arg === "-H" || arg === "--header") {
                        if (i + 1 < args.length) processHeader(args[++i]);
                        continue;
                    }
                    if (arg.startsWith("-H") && arg.length > 2) {
                        processHeader(arg.substring(2));
                        continue;
                    }
                    if (arg.startsWith("--header=")) {
                        processHeader(arg.substring(9));
                        continue;
                    }

                    // -b, --cookie
                    if (arg === "-b" || arg === "--cookie") {
                        if (i + 1 < args.length) cookieString = args[++i];
                        continue;
                    }
                    if (arg.startsWith("-b") && arg.length > 2) {
                        cookieString = arg.substring(2);
                        continue;
                    }
                    if (arg.startsWith("--cookie=")) {
                        cookieString = arg.substring(9);
                        continue;
                    }

                    // -A, --user-agent
                    if (arg === "-A" || arg === "--user-agent") {
                        if (i + 1 < args.length) userAgent = args[++i];
                        continue;
                    }
                    if (arg.startsWith("-A") && arg.length > 2) {
                        userAgent = arg.substring(2);
                        continue;
                    }
                    if (arg.startsWith("--user-agent=")) {
                        userAgent = arg.substring(13);
                        continue;
                    }

                    // -e, --referer
                    if (arg === "-e" || arg === "--referer") {
                        if (i + 1 < args.length) processHeader("Referer: " + args[++i]);
                        continue;
                    }
                    if (arg.startsWith("-e") && arg.length > 2) {
                        processHeader("Referer: " + arg.substring(2));
                        continue;
                    }
                    if (arg.startsWith("--referer=")) {
                        processHeader("Referer: " + arg.substring(10));
                        continue;
                    }

                    // Other known options with an argument
                    const lower = arg.toLowerCase();
                    if (knownOptionsWithArg.has(lower)) {
                        i++;
                        continue;
                    }

                    // Flags starting with -
                    if (arg.startsWith("-")) {
                        continue;
                    }

                    // Positional argument
                    positional.push(arg);
                }

                // If no explicit --url was provided, find the first positional argument that looks like a URL
                if (!url) {
                    url = positional.find((p) => /^https?:\/\//i.test(p)) || positional[0] || null;
                }

                if (!url) {
                    ytdlpOutput.innerHTML =
                        "<span class='text-red-400'>Error: Could not find a valid URL in the command.</span>";
                    copyButton.disabled = true;
                    return;
                }

                // Construct the final yt-dlp command
                const cmdParts = ["yt-dlp"];

                if (headers.length > 0) {
                    cmdParts.push(headers.join(" "));
                }

                if (userAgent) {
                    cmdParts.push(`--user-agent "${userAgent.replace(/"/g, '\\"')}"`);
                }

                if (cookieString && includeCookies.checked) {
                    cmdParts.push(`--add-header 'cookie: ${escapeSingleQuote(cookieString)}'`);
                }

                // Custom Output Filename Logic
                const customFilename = customFilenameInput.value.trim();
                const outputTemplate = customFilename
                    ? `${customFilename}.%(ext)s`
                    : "%(title)s.%(ext)s";
                cmdParts.push(`-o '${escapeSingleQuote(outputTemplate)}'`);

                // Final target URL
                cmdParts.push(`'${escapeSingleQuote(url)}'`);

                ytdlpOutput.textContent = cmdParts.join(" ");
                copyButton.disabled = false;
            }

            /**
             * Copies the content of a given element ID to the clipboard.
             * @param {string} elementId The ID of the element whose text to copy.
             */
            function copyToClipboard(elementId) {
                const textToCopy =
                    document.getElementById(elementId).textContent;

                // Use the older document.execCommand('copy') for better compatibility in iframe environments
                try {
                    const tempTextArea = document.createElement("textarea");
                    tempTextArea.value = textToCopy;
                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempTextArea);
                    showMessage("Copied to clipboard!");
                } catch (err) {
                    showMessage("Failed to copy command.", "error");
                    console.error("Copy failed: ", err);
                }
            }

            // Run conversion on paste or live typing/editing
            curlInput.addEventListener("paste", () => {
                // Use a short timeout to ensure the paste event is fully processed
                setTimeout(convertCurlToYtDlp, 10);
            });
            curlInput.addEventListener("input", convertCurlToYtDlp);

            // Add listeners to re-convert command whenever options change
            includeCookies.addEventListener("change", convertCurlToYtDlp);
            customFilenameInput.addEventListener("input", convertCurlToYtDlp);
        </script>
    </body>
</html>
